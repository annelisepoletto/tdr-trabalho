
name: Renderizar relatório

on:
  push:
    branches:
      - trabalho
  pull_request:
    branches:
      - trabalho

jobs:
  renderizar:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

     
      - name: Instalar bibliotecas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff-dev \
            libjpeg-dev \
            zlib1g-dev \
            libglpk-dev \
            libx11-dev \
            pandoc


      - name: Restaurar dependências do R
        uses: r-lib/actions/setup-renv@v2
      - name: Verificar estilo do código
        env:
          LINTR_ERROR_ON_LINT: true
        run: Rscript -e 'lintr::lint_dir()'

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Executar pipeline
        run: Rscript -e 'targets::tar_make(callr_function = NULL)'

      - name: Renderizar relatório
        run: quarto render relatorio.qmd

      - name: Disponibilizar relatório para download
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-html
          path: |
            relatorio.html
            relatorio_files/
          if-no-files-found: error
